<div class="page">
  <header>
    <a routerLink="/leaderboard" class="btn secondary">← Back</a>
    <h2>🏸 Add Match</h2>
  </header>

  @if (error) { <div class="error">⚠️ {{ error }}</div> }

  <div class="teams">
    <div class="team-card" [class.winner]="form.winner === '1'" [class.loser]="form.winner === '2'">
      <h3>🔵 Team 1</h3>
      <select [(ngModel)]="form.team1P1">
        <option value="">👤 Player 1</option>
        @for (p of available([form.team1P2, form.team2P1, form.team2P2]); track p.id) {
          <option [value]="p.id">{{ p.name }}</option>
        }
      </select>
      <select [(ngModel)]="form.team1P2">
        <option value="">👤 Player 2</option>
        @for (p of available([form.team1P1, form.team2P1, form.team2P2]); track p.id) {
          <option [value]="p.id">{{ p.name }}</option>
        }
      </select>
    </div>

    <div class="vs">⚔️</div>

    <div class="team-card" [class.winner]="form.winner === '2'" [class.loser]="form.winner === '1'">
      <h3>🔴 Team 2</h3>
      <select [(ngModel)]="form.team2P1">
        <option value="">👤 Player 1</option>
        @for (p of available([form.team1P1, form.team1P2, form.team2P2]); track p.id) {
          <option [value]="p.id">{{ p.name }}</option>
        }
      </select>
      <select [(ngModel)]="form.team2P2">
        <option value="">👤 Player 2</option>
        @for (p of available([form.team1P1, form.team1P2, form.team2P1]); track p.id) {
          <option [value]="p.id">{{ p.name }}</option>
        }
      </select>
    </div>
  </div>

  <div class="winner-row">
    <span class="winner-label">🏆 Who won?</span>
    <div class="winner-btns">
      <button class="winner-btn team1" [class.active]="form.winner === '1'" (click)="form.winner = '1'">🔵 Team 1</button>
      <button class="winner-btn team2" [class.active]="form.winner === '2'" (click)="form.winner = '2'">🔴 Team 2</button>
    </div>
  </div>

  <div class="loser-score-row">
    <label>📉 Loser's score</label>
    <input type="number" [(ngModel)]="form.loserScore" min="0" [max]="form.matchPoint" placeholder="0">
  </div>

  <div class="match-point-row">
    <label>🎯 Match Point</label>
    <select [(ngModel)]="form.matchPoint">
      @for (c of matchPointConfigs; track c) {
        <option [value]="c">{{ c }}-{{ c }}</option>
      }
    </select>
  </div>

  <button class="btn" (click)="submit()" [disabled]="submitting">{{ submitting ? 'Saving…' : '✅ Save Match' }}</button>
</div>
